<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<rect width="1200" height="1200" fill="#F2E8D6"/>
<defs>
  <clipPath id="circle"><circle cx="600" cy="430" r="340"/></clipPath>
</defs>

<g clip-path="url(#circle)">
  <rect x="260" y="90" width="680" height="680" fill="#F2E8D6"/>
  <!-- left interior / light -->
  <polygon points="260,90 585,90 585,265 260,610" fill="#D8C6AA"/>
  <polygon points="260,610 585,265 585,650 260,560" fill="#F8F3E8"/>
  <polygon points="260,560 585,650 585,770 350,720" fill="#FBF7EE"/>

  <!-- mountain layers -->
  <polygon points="585,365 675,310 765,365 845,315 940,375 940,500 585,500" fill="#C9D2D6"/>
  <polygon points="585,455 700,385 785,440 880,375 940,415 940,575 585,575" fill="#8FA9BF"/>
  <polygon points="585,545 720,465 805,520 900,455 940,480 940,655 585,655" fill="#557A9B"/>

  <!-- sun -->
  <circle cx="825" cy="235" r="42" fill="#D1A34A"/>

  <!-- foreground / reflection -->
  <polygon points="260,690 585,640 940,690 940,770 260,770" fill="#244765"/>
  <polygon points="585,650 940,565 940,770 585,770" fill="#18334E"/>
  <line x1="260" y1="560" x2="940" y2="705" stroke="#F2E8D6" stroke-width="3"/>

  <!-- trees -->
  <g fill="#2F4A3A">
    <polygon points="720,610 744,545 768,610"/><polygon points="714,625 744,565 774,625"/>
    <rect x="740" y="620" width="8" height="25" fill="#79583F"/>
    <polygon points="790,585 820,505 850,585"/><polygon points="782,610 820,530 858,610"/>
    <rect x="816" y="605" width="8" height="28" fill="#79583F"/>
    <polygon points="865,555 902,455 939,555"/><polygon points="855,590 902,490 949,590"/>
    <rect x="898" y="585" width="9" height="30" fill="#79583F"/>
  </g>
</g>

<!-- porthole / divider -->
<circle cx="600" cy="430" r="340" fill="none" stroke="#C99743" stroke-width="10"/>
<line x1="585" y1="90" x2="585" y2="770" stroke="#C99743" stroke-width="10"/>

<!-- wordmark -->
<text x="600" y="950" text-anchor="middle" font-family="Avenir Next, Montserrat, Helvetica, Arial, sans-serif"
      font-size="105" font-weight="300" letter-spacing="28" fill="#16334E">SOFT WOW</text>
<line x1="275" y1="1048" x2="335" y2="1048" stroke="#C99743" stroke-width="4"/>
<text x="600" y="1075" text-anchor="middle" font-family="Avenir Next, Montserrat, Helvetica, Arial, sans-serif"
      font-size="58" font-weight="300" letter-spacing="35" fill="#C99743">CABIN</text>
<line x1="865" y1="1048" x2="925" y2="1048" stroke="#C99743" stroke-width="4"/>
</svg>